ion gp(A,e,t){var n,l={},r=null,u=null;t!==void 0&&(r=""+t),e.key!==void 0&&(r=""+e.key),e.ref!==void 0&&(u=e.ref);for(n in e)Nd.call(e,n)&&!Ud.hasOwnProperty(n)&&(l[n]=e[n]);if(A&&A.defaultProps)for(n in e=A.defaultProps,e)l[n]===void 0&&(l[n]=e[n]);return{$$typeof:Sd,type:A,key:r,ref:u,props:l,_owner:qd.current}}var $u=Td,a=gp,m=gp;var kd=[{id:"kapitel-i",title:"KAPITEL I",subtitle:"Allgemeines & Grundsätze",paragraphs:[{id:"p1",num:"§1",title:"Zuständigkeit des LSMD",body:["Das Los Santos Medical Department (LSMD) ist die alleinige staatliche Institution für die präklinische und klinische Notfallversorgung im Staate Los Santos. Dies umfasst das gesamte Stadtgebiet, Blaine County und alle umliegenden Gebiete. Das LSMD handelt auf Grundlage des Staatsdienstgesetzes. Das LSMD ist kein Teil des LSPD, arbeitet aber eng mit allen Behörden zusammen."]},{id:"p2",num:"§2",title:"Neutralität und Unparteilichkeit",body:["1. Das LSMD ist eine neutrale Fraktion. Mitarbeiter greifen nicht in kriminelle oder polizeiliche Aktivitäten ein.","2. Jeder Patient ist gleich zu behandeln, unabhängig von Fraktion, Herkunft oder Vorstrafen. Ein Gangmitglied erhält die gleiche professionelle Behandlung wie ein Polizist.","3. Das Tragen von Gang-Kleidung oder Gang-Symbolen im Dienst ist untersagt."]},{id:"p3",num:"§3",title:"Schweigepflicht",body:["1. Alle LSMD-Mitarbeiter unterliegen der ärztlichen Schweigepflicht. Alle Patienteninformationen, Verletzungen und Gespräche im Behandlungsraum sind streng vertraulich.","2. Eine Weitergabe an das LSPD oder andere Behörden erfolgt nur mit ausdrücklicher Zustimmung des Patienten oder bei akuter Gefahr für Leib und Leben Dritter.","3. Verstoß gegen die Schweigepflicht führt zur sofortigen Suspendierung."]},{id:"p4",num:"§4",title:"Auftreten und Dienstkleidung",body:["1. Im Dienst ist ausschließlich die vorgeschriebene LSMD-Dienstkleidung zu tragen.","2. Das Auftreten hat stets professionell, respektvoll und deeskalierend zu sein.","3. Private Fahrzeuge dürfen im Dienst nicht verwendet werden. Ausnahme nur mit Genehmigung der Direktion."]}]},{id:"kapitel-ii",title:"KAPITEL II",subtitle:"Rangstruktur & Befugnisse",paragraphs:[{id:"p5",num:"§5",title:"Rangordnung des LSMD",body:["Die Rangordnung (aufsteigend):","Rang 1 - Praktikant (Prak): Anwärter, nur unter Aufsicht.","Rang 2 - Sanitäter (San): RTW-Besatzung, Grundversorgung.","Rang 3 - Rettungssanitäter (RS): Erweiterte Maßnahmen.","Rang 4 - Notfallsanitäter (NFS): Höchste nicht-ärztliche Qualifikation, Taser freigegeben.","Rang 5 - Assistenzarzt (AA): Erste ärztliche Befugnis.","Rang 6 - Arzt: Eigenständige OPs, Atteste.","Rang 7 - Oberarzt (OA): Ausbildungsleitung.","Rang 8 - Chefarzt (CA): Stellv. Leitung.","Rang 9 - Direktor: Leitung des LSMD."]},{id:"p6",num:"§6",title:"Weisungsbefugnis",body:["Höherer Rang ist gegenüber niedrigerem Rang weisungsbefugt. Im Einsatz hat der ranghöchste Medic vor Ort die Einsatzleitung. Anordnungen der Direktion sind bindend."]},{id:"p7",num:"§7",title:"Ausbildungspflicht",body:["Jede Beförderung erfordert eine theoretische und praktische Prüfung sowie Dienststunden. Praktikanten müssen mindestens 5 begleitete Behandlungen absolvieren."]},{id:"p8",num:"§8",title:"Außerdienstliches Verhalten",body:["Auch außer Dienst ist das Ansehen des LSMD zu wahren. Kriminelle Handlungen führen zu dienstrechtlichen Konsequenzen."]}]},{id:"kapitel-iii",title:"KAPITEL III",subtitle:"Pflichten, Rechte & Verhalten",paragraphs:[{id:"p9",num:"§9",title:"Dienstpflicht & Erreichbarkeit (NEU)",body:["1. Wer sich in den Dienst begibt, hat diesen gewissenhaft und aktiv auszuführen. Der Dienst ist eine aktive Tätigkeit - wer keine Lust mehr hat, geht bitte korrekt außer Dienst (Status 7).","2. Kurze AFK-Pausen (WC, Getränk, kurzes Telefonat) sind natürlich erlaubt - bitte vorher im Funk als Status 6 melden: 'Status 6 - kurze Pause 5 Min'. Länger als 10 Minuten AFK bitte außer Dienst gehen.","3. Der Dienstfunk ist stets im Auge zu behalten. Auf direkte Funkrufe oder Notrufe ist schnellstmöglich zu reagieren. Wer im Status 1-5 ist, gilt als ansprechbar."]},{id:"p10",num:"§10",title:"Funkdisziplin, Status- & Code-System (NEU - 8 Einträge)",body:["Der LSMD-Funk ist ausschließlich dienstlich zu nutzen. Spam, Musik oder private Gespräche sind untersagt.","","--- CODES (für Polizei-Alarmierung & Freigabe) ---","CODE 0: NOTFALL - Eigenes Leben in Gefahr! Sofortige Unterstützung durch LSPD/LSSD erforderlich. Standort durchgeben!","CODE 4: Lage sicher - Einsatzort wurde durch LSPD gesichert oder ist sicher. Behandlung freigegeben. Alle Einheiten können anfahren.","","--- STATUS (für unseren eigenen Dienst) ---","Status 1: Einsatzbereit / Frei für Einsätze","Status 2: Auf Anfahrt zum Einsatzort","Status 3: Am Einsatzort - Behandlung läuft","Status 4: Transport ins LSMD","Status 5: Im LSMD - Stationäre Behandlung","Status 6: Kurze Pause (WC/AFK) - max. 10 Min, nicht ansprechbar","Status 7: Außer Dienst","Status 8: Reanimation läuft - bitte nicht stören","","Beispiel: 'Hier 1234, Status 2 zum 10-20 Market' oder 'Code 0 am 10-20 Legion Square, brauche PD!'"]},{id:"p11",num:"§11",title:"Behandlungspflicht & Diskriminierungsverbot",body:["Es besteht eine unbedingte Behandlungspflicht. Die Verweigerung einer Behandlung aus persönlichen Gründen ist untersagt und führt zu Disziplinarmaßnahmen."]},{id:"p12",num:"§12",title:"Recht auf Selbstschutz und Umgang mit aggressiven Patienten",body:["1. Ist die Eigensicherung nicht gewährleistet (aktive Schießerei ohne PD-Absicherung), darf der Einsatzort nicht betreten werden. Eigenschutz geht vor Fremdschutz.","2. Beleidigt, bedroht oder greift ein Patient das Personal massiv an, ist nach einer deutlichen Verwarnung ('Beruhigen Sie sich, sonst muss ich den Einsatz abbrechen') die Behandlung abzubrechen. Bei Bedarf ist sofort Code 0 für PD-Unterstützung zu alarmieren. Der Vorfall ist im Anschluss zu dokumentieren."]},{id:"p13",num:"§13",title:"Korruptionsverbot & Looting-Verbot",body:["1. Das Annehmen von Bestechungsgeldern, Drogen oder illegalen Gegenständen für eine bevorzugte Behandlung ist strengstens verboten.","2. Das Ausstellen von falschen medizinischen Attesten, Gefälligkeitsgutachten oder unwahren Berichten ist Korruption und führt zur fristlosen Kündigung und Meldung an das LSPD.","3. Das Looten von Patienten (Abnehmen von Waffen, Geld, Items) ist absolut verboten. Ausnahme: Sicherstellung einer Waffe zur Eigensicherung, diese ist sofort dem LSPD zu übergeben und zu dokumentieren."]}]},{id:"kapitel-iv",title:"KAPITEL IV",subtitle:"Einsatzprotokoll & Operative Grundsätze",paragraphs:[{id:"p14",num:"§14",title:"Alarmierung und Ausrücken",body:["1. Ein Notruf muss innerhalb von 60 Sekunden angenommen werden.","2. Ausrücken erfolgt grundsätzlich mit mindestens 2 Medics auf einem RTW. Alleinfahrten sind nur auf Rang Sanitäter und nur bei niedriger Personalzahl erlaubt.","3. Bei Anfahrt mit Sonderrechten ist mit erhöhter Vorsicht zu fahren."]},{id:"p15",num:"§15",title:"Triage-System",body:["Bei mehreren Verletzten ist nach folgendem System zu triagieren:","- ROT: Lebensgefahr, sofortige Behandlung.","- GELB: Schwer verletzt, dringend.","- GRÜN: Leicht verletzt, kann warten.","- Priorität hat immer die schwerste Verletzung, nicht wer zuerst gerufen hat."]},{id:"p16",num:"§16",title:"Reanimation und Korrektes RP-Verhalten (WICHTIG FÜR RP) - NEUFASSUNG",body:["Grundsatz: Im Los Santos Medical Department gibt es keinen endgültigen Tod. Jeder Patient wird immer versorgt und ins LSMD gebracht. Unsere Aufgabe ist die professionelle medizinische RP-Versorgung.","","1. Korrekte Durchführung der Reanimation vor Ort:","Jeder Einsatz muss mit gutem RP ausgespielt werden. Der Medic prüft zuerst den Zustand des Patienten, zieht Handschuhe an, kontrolliert Puls und Atmung und begutachtet die Verletzungen. Danach wird die notwendige Erstversorgung durchgeführt, wie Wunden verbinden, Blutung stillen, Defibrillator einsetzen und Herzdruckmassage durchführen. Jede Reanimation muss mindestens 2-3 ausführliche RP-Handlungen enthalten. Schnelles Durchklicken ohne RP ist nicht erlaubt.","","2. Besondere Verletzungen richtig ausspielen:","a) Kopfverletzung: Starke Blutung, muss druckvoll verbunden und der Patient schnell stabilisiert werden. Erfordert längeres RP.","b) Verbrennungen: Patient hat starke Schmerzen und Schock. Muss gekühlt und mit Infusionen versorgt werden.","c) Lange Bewusstlosigkeit: Patient ist unterkühlt und hat Sauerstoffmangel. Muss mit Sauerstoff und Wärme versorgt werden.","","3. Weitertransport und Versorgung im LSMD:","Nach der Erstversorgung vor Ort wird jeder Patient immer ins LSMD transportiert. Dort erfolgt die vollständige medizinische Versorgung auf der Krankenstation, Intensivstation oder im OP. Im LSMD wird der Patient weiter behandelt, untersucht und gesund gepflegt, bis er wieder vollständig einsatzfähig ist. Es wird niemals ein Tod ausgespielt, sondern immer eine Weiterbehandlung.","","4. Dokumentation:","Jeder Einsatz und jede Reanimation muss im MDW dokumentiert werden: Was ist passiert, welche Verletzungen und welche Behandlung wurde durchgeführt. Ziel ist immer gutes und realistisches medizinisches RP."]},{id:"p17",num:"§17",title:"Zusammenarbeit mit LSPD/LSSD",body:["Das LSMD ist nicht weisungsgebunden an die Polizei, arbeitet aber eng zusammen. Tatorte dürfen erst nach Freigabe (Code 4) durch die Polizei betreten werden. Das LSMD trifft keine Schuldfeststellung."]},{id:"p18",num:"§18",title:"Geiselnahme eines LSMD-Mitarbeiters",body:["1. Das LSMD zahlt kein Lösegeld. Zu keiner Zeit.","2. Ein als Geisel genommener Medic darf keine Behandlung für Geiselnehmer durchführen, solange er selbst bedroht wird.","3. Das LSPD ist sofort über Code 0 zu informieren."]},{id:"p19",num:"§19",title:"Verhalten bei Schießereien",body:["Medics halten sich aus Schusslinien fern. RTW darf nicht als Deckung für Gangs/Polizei missbraucht werden. Bei Beschuss: Sofort Rückzug und Code 0."]}]},{id:"kapitel-v",title:"KAPITEL V",subtitle:"Medizinische Behandlung & Medikamente",paragraphs:[{id:"p20",num:"§20",title:"Behandlungsprotokoll",body:["1. Vorstellung: 'Hallo, ich bin [Rang] [Name] vom LSMD, ich helfe Ihnen.'","2. Anamnese: Was ist passiert? Wo Schmerzen? Allergien?","3. Untersuchung: /me untersucht Wunden","4. Behandlung: RP-gerecht verbinden, Medikamente","5. Dokumentation im MDW."]},{id:"p21",num:"§21",title:"Medikamentenfreigabe nach Rang",body:["Praktikant: Pflaster, Verband, leichtes Schmerzmittel","Sanitäter: + Kochsalzlösung, leichtes Adrenalin","Rettungssanitäter: + Adrenalin voll, Beatmungsgerät","Notfallsanitäter: + Morphin, Taser zur Eigensicherung","Ab Assistenzarzt: Alle Medikamente, OPs"]},{id:"p22",num:"§22",title:"Zwangsbehandlung",body:["Behandlung gegen den Willen eines ansprechbaren und zurechnungsfähigen Patienten ist verboten. Bei bewusstlosen Personen wird von mutmaßlicher Einwilligung ausgegangen."]},{id:"p23",num:"§23",title:"Psychologische Betreuung",body:["Das LSMD bietet auf Wunsch psychologische Gespräche an. Diese unterliegen absoluter Schweigepflicht."]},{id:"p24",num:"§24",title:"Operationen",body:["Operationen nur durch Ärzte und nur in OP-Sälen des LSMD. Einwilligung per /do erforderlich."]}]},{id:"kapitel-vi",title:"KAPITEL VI",subtitle:"Fahrzeuge & Equipment",paragraphs:[{id:"p25",num:"§25",title:"Dienstfahrzeuge",body:["RTW: Standard für 2 Personen.","NEF: Für Ärzte, schneller.","Helikopter: MedEvac, nur mit Fluglizenz und ab NFS/Arzt."]},{id:"p26",num:"§26",title:"Ausrüstung",body:["Ausrüstung nach jedem Dienst auffüllen. Fehlende Ausrüstung melden."]},{id:"p27",num:"§27",title:"Waffenverbot",body:["Schusswaffen verboten. Ausnahme: Taser X26 ab NFS zur Eigensicherung, niemals offensiv."]},{id:"p28",num:"§28",title:"Uniformpflicht",body:["Uniformpflicht und Helm bei Helikopter-Einsätzen."]}]},{id:"kapitel-vii",title:"KAPITEL VII",subtitle:"Disziplinarmaßnahmen",paragraphs:[{id:"p29",num:"§29",title:"Katalog",body:["1. Mündliche Verwarnung","2. Schriftliche Verwarnung","3. Suspendierung (1-7 Tage)","4. Degradierung","5. Fristlose Kündigung + Blacklist"]},{id:"p30",num:"§30",title:"Gründe für sofortige Kündigung",body:["- Looten","- Korruption","- Weitergabe Patientendaten","- Absichtliches Überfahren/Töten","- Cheating/Bugusing"]},{id:"p31",num:"§31",title:"Beschwerdemanagement",body:["Beschwerden können beim Oberarzt/Chefarzt eingereicht werden."]},{id:"p32",num:"§32",title:"Dienstaufsicht",body:["Direktion darf unangekündigte Kontrollen durchführen."]}]}],Wd=[{id:"kapitel-i",label:"Kapitel I",range:"§1 bis §4",desc:"Allgemeines & Grundsätze"},{id:"kapitel-ii",label:"Kapitel II",range:"§5 bis §8",desc:"Rangstruktur"},{id:"kapitel-iii",label:"Kapitel III",range:"§9 bis §13",desc:"Pflichten & Verhalten"},{id:"kapitel-iv",label:"Kapitel IV",range:"§14 bis §19",desc:"Einsatzprotokoll"},{id:"kapitel-v",label:"Kapitel V",range:"§20 bis §24",desc:"Medizinische Behandlung"},{id:"kapitel-vi",label:"Kapitel VI",range:"§25 bis §28",desc:"Fahrzeuge & Equipment"},{id:"kapitel-vii",label:"Kapitel VII",range:"§29 bis §32",desc:"Disziplinarmaßnahmen"},{id:"anhang",label:"Anhang A & B",range:"Eid & Lücken",desc:"Zusatz & Platzhalter"}],Hp=[{id:"kleidung-praktikum",slug:"praktikum",num:"01",name:"Praktikum",pos:"POS #1/11",color:"#fbbf24",artikel:6,variantCountLabel:"2 VARIANTEN • GETRENNT",custom:!0,variants:[{key:"aussen",label:"Variante 1 - Außendienst",desc:`Praktikant Variante 1 - Außendienst:

Im Außendienst muss die komplette vorgeschriebene Kleidung laut Tabelle getragen werden.

Brille und Mütze sind erlaubt. Bei Behandlungen muss die Mütze abgezogen werden.

Auf seriöses Auftreten wird geachtet. Keine Spaß-Artikel.`,items:[{kat:"T-Shirt / Undershirt",nr:"289",var:"0"},{kat:"Oberkörper",nr:"639",var:"1"},{kat:"Hose",nr:"271",var:"0"},{kat:"Schuhe",nr:"24",var:"0"},{kat:"Arme",nr:"85",var:"0"}]},{key:"innen",label:"Variante 2 - Innendienst",desc:`Praktikant Variante 2 - Innendienst:

Im Innendienst muss nur das T-Shirt aus der Regelung getragen werden.

Ansonsten normale Hose - darf jeder selbst aussuchen. Muss normal und seriös sein.

Keine Jogginghose, keine Shorts.`,items:[{kat:"Oberkörper",nr:"639",var:"1"}]}]},{id:"kleidung-ausbildung",slug:"ausbildung",num:"02",name:"Ausbildung",pos:"POS #2/11",color:"#fbbf24",artikel:14,variantCountLabel:"2 VARIANTEN • GETRENNT",custom:!0,variants:[{key:"san",label:"Variante 1 - Ausbildung Sanitäter",desc:`Sanitäter:

Im Dienst muss die komplette vorgeschriebene Kleidung laut Tabelle getragen werden.

Brille und Mütze sind erlaubt. Bei Behandlungen und Patientenkontakt muss die Mütze abgezogen werden.

Seriöses und ordentliches Auftreten ist Pflicht. Keine Spaß-Artikel oder unangemessene Kleidung.`,items:[{kat:"T-Shirt / Undershirt",nr:"154",var:"0"},{kat:"Oberkörper",nr:"639",var:"2"},{kat:"Hose",nr:"277",var:"2"},{kat:"Schuhe",nr:"24",var:"0"},{kat:"Arme",nr:"85",var:"0"},{kat:"Kette",nr:"127",var:"0"},{kat:"Maske",nr:"254",var:"0"}]},{key:"doc",label:"Variante 2 - Ausbildung Doktor",desc:`Doktor Ausbildung / Azubi Doktor:

Als Azubi Doktor befindest du dich in einem sehr wichtigen Abschnitt deiner Ausbildung. Du stehst kurz vor dem Übertritt in den ärztlichen Dienst und trägst bereits eine hohe Verantwortung. Dein Auftreten sollte daher stets professionell, respektvoll und vorbildlich sein.`,items:[{kat:"T-Shirt / Undershirt",nr:"154",var:"0"},{kat:"Oberkörper",nr:"639",var:"2"},{kat:"Hose",nr:"285",var:"0"},{kat:"Schuhe",nr:"109",var:"1"},{kat:"Arme",nr:"85",var:"0"},{kat:"Kette",nr:"126",var:"0"},{kat:"Maske",nr:"254",var:"0"}]}]},{id:"kleidung-innendienst-im-md",slug:"innendienst-im-md",num:"03",name:"Innendienst (Im MD)",pos:"POS #3/11",color:"#fbbf24",artikel:14,variantCountLabel:"2 VARIANTEN • GETRENNT",custom:!0,variants:[{key:"pflege",label:"Variante 1 - Innendienst Pflege",desc:`Variante 1 - Innendienst Pflege:

Als Mitarbeiter in der Pflege im Innendienst bist du für die Betreuung und Versorgung unserer Patienten im Haus zuständig. Dein Auftreten sollte daher stets freundlich, ruhig und professionell sein und den Patienten ein Gefühl von Sicherheit geben.

Im Innendienst ist das vorgeschriebene T-Shirt laut Tabelle zu tragen. Dazu trägst du eine normale, seriöse Hose und normale, geschlossene Schuhe.

Brille und Mütze sind erlaubt, bei Behandlungen und im direkten Patientenkontakt ist die Mütze jedoch abzunehmen.

Auf ein sauberes und seriöses Erscheinungsbild wird großen Wert gelegt, Spaß-Artikel oder auffällige, witzige Kleidung sind nicht gestattet.`,items:[{kat:"T-Shirt / Undershirt",nr:"15",var:"0"},{kat:"Oberkörper",nr:"589",var:"6"},{kat:"Hose",nr:"207",var:"1"},{kat:"Schuhe",nr:"155",var:"0"},{kat:"Kette",nr:"126",var:"0"},{kat:"Maske",nr:"254",var:"0"},{kat:"Arme",nr:"85",var:"0"}]},{key:"doktor",label:"Variante 2 - Innendienst Doktor (Alle Positionen)",desc:`Variante 2 - Innendienst Doktor (Alle Positionen):

Diese Regelung gilt für alle ärztlichen Positionen. Als Doktor trägst du die höchste medizinische Verantwortung und bist sowohl für Patienten als auch für das gesamte Personal ein Vorbild. Ein ruhiges, professionelles und vorbildliches Auftreten wird daher vorausgesetzt.

Im Innendienst ist das vorgeschriebene T-Shirt laut Tabelle zu tragen. Dazu trägst du eine normale, seriöse Hose und normale, geschlossene Schuhe. Jogginghosen und Shorts sind nicht gestattet.

Brille und Mütze sind erlaubt, bei Behandlungen und im direkten Patientenkontakt ist die Mütze jedoch abzunehmen.

Auf ein sauberes und absolut seriöses Erscheinungsbild wird größten Wert gelegt, Spaß-Artikel oder auffällige Kleidung sind nicht gestattet.`,items:[{kat:"T-Shirt / Undershirt",nr:"15",var:"0"},{kat:"Oberkörper",nr:"589",var:"3"},{kat:"Hose",nr:"207",var:"1"},{kat:"Schuhe",nr:"155",var:"0"},{kat:"Kette",nr:"126",var:"0"},{kat:"Maske",nr:"254",var:"0"},{kat:"Arme",nr:"85",var:"0"}]}]},{id:"kleidung-innendienst-op-psych",slug:"innendienst-op-psychologie",num:"04",name:"Innendienst (OP&Psychologie) [Im MD]",pos:"POS #4/11",color:"#fbbf24",artikel:14,variantCountLabel:"2 VARIANTEN • GETRENNT",custom:!0,variants:[{key:"op",label:"Variante 1 - Innendienst OP",desc:`Variante 1 - Innendienst OP:

Als Mitarbeiter im OP-Bereich im Innendienst trägst du eine besonders hohe Verantwortung. Hygiene, Sauberkeit und ein ruhiges, professionelles Auftreten stehen hier an oberster Stelle und sind für die Sicherheit unserer Patienten unerlässlich.

Im Innendienst ist das vorgeschriebene T-Shirt laut Tabelle zu tragen. Dazu trägst du eine normale, seriöse Hose und normale, geschlossene Schuhe. Auf ein absolut sauberes und ordentliches Erscheinungsbild ist zu achten.

Brille und Mütze sind erlaubt, bei Behandlungen und Eingriffen ist die Mütze jedoch abzunehmen bzw. durch die vorgeschriebene OP-Haube zu ersetzen.

Spaß-Artikel oder auffällige, witzige Kleidung sind im OP-Bereich nicht gestattet.`,items:[{kat:"T-Shirt / Undershirt",nr:"15",var:"0"},{kat:"Oberkörper",nr:"589",var:"7"},{kat:"Hose",nr:"207",var:"1"},{kat:"Schuhe",nr:"155",var:"0"},{kat:"Kette",nr:"126",var:"0"},{kat:"Maske",nr:"254",var:"0"},{kat:"Arme",nr:"85",var:"0"}]},{key:"psy",label:"Variante 2 - Innendienst Psychologie ABT.",desc:`Variante 2 - Innendienst Psychologie ABT.:

Als Mitarbeiter der Psychologie Abteilung trägst du eine besondere Verantwortung. Du bist eine wichtige Vertrauensperson für unsere Patienten, weshalb ein ruhiges, empathisches und absolut professionelles Auftreten unerlässlich ist.

Im Innendienst ist das vorgeschriebene T-Shirt laut Tabelle zu tragen. Dazu trägst du eine normale, seriöse Hose und normale, geschlossene Schuhe. Jogginghosen und Shorts sind nicht gestattet.

Brille und Mütze sind erlaubt, in Gesprächen und während Behandlungen ist die Mütze jedoch abzunehmen, um einen respektvollen und vertrauensvollen Eindruck zu gewährleisten.

Auf ein sauberes und seriöses Erscheinungsbild wird größten Wert gelegt, Spaß-Artikel oder auffällige, witzige Kleidung sind nicht gestattet.`,items:[{kat:"T-Shirt / Undershirt",nr:"15",var:"0"},{kat:"Oberkörper",nr:"589",var:"4"},{kat:"Hose",nr:"207",var:"1"},{kat:"Schuhe",nr:"155",var:"0"},{kat:"Kette",nr:"126",var:"0"},{kat:"Maske",nr:"254",var:"0"},{kat:"Arme",nr:"85",var:"0"}]}]},{id:"kleidung-rettungssanitaeter",slug:"rettungssanitaeter",num:"05",name:"Rettungssanitäter",pos:"POS #5/11",color:"#fbbf24",artikel:8,custom:!0,variants:[{key:"std",label:"Standard",desc:`Rettungssanitäter:

Als Rettungssanitäter bist du ein wichtiger Teil des Teams und übernimmst bereits viel Verantwortung im Einsatzgeschehen. Du bist ein Vorbild für unsere Praktikanten und Azubis, weshalb ein professionelles und seriöses Auftreten besonders wichtig ist.

Es ist die komplette vorgeschriebene Dienstkleidung laut Tabelle sauber und ordentlich zu tragen.

Brille und Mütze sind erlaubt, bei Behandlungen und im direkten Patientenkontakt ist die Mütze jedoch abzunehmen.

Spaß-Artikel oder auffällige, witzige Kleidung sind nicht gestattet.`,items:[{kat:"T-Shirt / Undershirt",nr:"154",var:"0"},{kat:"Oberkörper",nr:"639",var:"3"},{kat:"Hose",nr:"264",var:"0"},{kat:"Schuhe",nr:"103",var:"0"},{kat:"Arme",nr:"85",var:"0"},{kat:"Kette",nr:"127",var:"0"},{kat:"Schusssicher",nr:"130",var:"0"},{kat:"Maske",nr:"254",var:"0"}]}]},{id:"kleidung-rettungsassistent",slug:"rettungsassistent",num:"06",name:"Rettungsassistent",pos:"POS #6/11",color:"#fbbf24",artikel:8,custom:!0,variants:[{key:"std",label:"Standard",desc:`Rettungsassistent:

Als Rettungsassistent trägst du eine besonders hohe Verantwortung und gehörst zu den erfahrensten Kräften im Dienst. Von dir wird erwartet, dass du in jeder Situation ruhig, professionell und vorbildlich auftrittst und damit ein Vorbild für alle anderen Mitarbeiter bist.

Es ist die komplette vorgeschriebene Dienstkleidung laut Tabelle sauber und ordentlich zu tragen.

Brille und Mütze sind erlaubt, bei Behandlungen und im direkten Patientenkontakt ist die Mütze jedoch abzunehmen.

Auf ein seriöses Erscheinungsbild wird großen Wert gelegt, Spaß-Artikel oder auffällige, witzige Kleidung sind nicht gestattet.`,items:[{kat:"T-Shirt / Undershirt",nr:"154",var:"0"},{kat:"Oberkörper",nr:"639",var:"3"},{kat:"Hose",nr:"264",var:"2"},{kat:"Schuhe",nr:"103",var:"0"},{kat:"Arme",nr:"85",var:"0"},{kat:"Kette",nr:"127",var:"0"},{kat:"Schusssicher",nr:"130",var:"0"},{kat:"Maske",nr:"254",var:"0"}]}]},{id:"kleidung-notfallsanitaeter",slug:"notfallsanitaeter",num:"07",name:"Notfallsanitäter",pos:"POS #7/11",color:"#ef4444",artikel:8,custom:!0,variants:[{key:"notfall",label:"Notfall Sanitäter",desc:`Notfall Sanitäter:

Als Notfall Sanitäter bist du oft als Erster am Einsatzort und trägst eine besonders hohe Verantwortung. In Notfallsituationen kommt es auf dein schnelles, ruhiges und professionelles Handeln an. Du bist das Aushängeschild des Medical Departments und ein Vorbild für alle darunterliegenden Ränge.

Es ist die komplette vorgeschriebene Dienstkleidung laut Tabelle sauber und ordentlich zu tragen.
