<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LSMD - Zentrale</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700;800&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050507;color:#fff;font-family:Inter,sans-serif;overflow-x:hidden;min-height:100dvh}
.bg{position:fixed;inset:0;z-index:0}
.bg::before{content:"";position:absolute;inset:0;background:radial-gradient(600px at 0% 0%,rgba(30,64,175,0.18),transparent 60%),radial-gradient(600px at 100% 100%,rgba(220,38,38,0.15),transparent 60%)}
.bg::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,0.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.015) 1px,transparent 1px);background-size:32px 32px;opacity:0.6}
.wrap{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column}
.top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:rgba(10,10,12,0.85);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,0.06);position:sticky;top:0;z-index:10}
.logo-s{width:32px;height:32px;border-radius:50%;border:1.5px solid #D4AF37}
.brand{font-family:Rajdhani;font-weight:800;letter-spacing:0.08em;font-size:14px}
.dot{width:6px;height:6px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e}
.hero{padding:28px 18px 18px;text-align:center}
.logo-l{width:78px;height:78px;border-radius:50%;border:2.5px solid #D4AF37;box-shadow:0 0 24px rgba(212,175,55,0.25);margin:0 auto 12px;display:block}
.h1{font-family:Rajdhani;font-weight:800;font-size:22px;letter-spacing:0.06em;background:linear-gradient(135deg,#D4AF37,#f9e076);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:11px;color:rgba(255,255,255,0.45);letter-spacing:0.12em;margin-top:4px;text-transform:uppercase;font-weight:600}

.grid{padding:14px 14px 0;display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:520px;margin:0 auto;width:100%}
@media(max-width:400px){.grid{grid-template-columns:1fr 1fr;gap:10px} .card{padding:14px 12px}}
.card{position:relative;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:16px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-decoration:none;transition:all .18s;min-height:110px}
.card:active{transform:scale(0.96)}
.card:hover{border-color:rgba(212,175,55,0.22);background:rgba(255,255,255,0.07)}
.card.gold{border-color:rgba(212,175,55,0.32);background:linear-gradient(145deg,rgba(212,175,55,0.14),rgba(255,255,255,0.05));box-shadow:0 0 20px rgba(212,175,55,0.12)}
.card-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08)}
.card.gold .card-icon{background:rgba(212,175,55,0.15);border-color:rgba(212,175,55,0.25)}
.card-title{font-family:Rajdhani;font-weight:700;font-size:14.5px;line-height:1.15;color:#fff;letter-spacing:0.01em}
.card-dot{position:absolute;top:12px;right:12px;width:6px;height:6px;border-radius:50%}
.card.gold .card-dot{background:#22c55e;box-shadow:0 0 8px #22c55e}
.card:not(.gold) .card-dot{background:rgba(255,255,255,0.18)}

.footer{margin:22px auto 0;max-width:520px;width:calc(100% - 28px);padding:14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:16px;display:flex;align-items:center;gap:10px}
.footer-icon{width:28px;height:28px;border-radius:50%;background:rgba(212,175,55,0.12);border:1px solid rgba(212,175,55,0.2);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.footer-text{font-size:11px;color:rgba(255,255,255,0.55);line-height:1.4}
.footer-text b{color:#D4AF37}

.spacer{height:90px}
.nav{position:fixed;bottom:0;left:0;right:0;height:76px;background:rgba(8,8,10,0.94);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.06);display:flex;justify-content:center;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.nav-inner{display:flex;gap:32px;align-items:center;height:100%}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;opacity:0.9}
.nav-item.active{opacity:1}
.nav-item.active .nav-ic{background:linear-gradient(135deg,#dc2626,#1E40AF);box-shadow:0 0 12px rgba(220,38,38,0.3)}
.nav-ic{width:28px;height:28px;border-radius:9px;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;font-size:14px}
.nav-lb{font-family:Rajdhani;font-size:9px;font-weight:700;letter-spacing:0.12em;color:rgba(255,255,255,0.4)}
.nav-item.active .nav-lb{color:#fff}
</style>
</head>
<body>
<div class="bg"></div>

  <div class="hero">

  </div>

  <div class="grid">
    <a href="container:///mnt/data/lsmd_grundgesetzbuch_mobile_agentic_artifact_2_75b613f1e1d3.html" class="card gold">

    <a href="container:///mnt/data/psychologische_abteilung.html" class="card">
      <div class="card-dot"></div>
      <div class="card-icon">🧠</div>
      <div class="card-title">Psychologie</div>

    <a href="container:///mnt/data/systemausfall_backup.html" class="card">
      <div class="card-dot"></div>
      <div class="card-icon">⚠️</div>
      <div class="card-title">System<br>Backup</div>
    </a>
    <a href="container:///mnt/data/abrechnungssystem.html" class="card">
      <div class="card-dot"></div>
      <div class="card-icon">💶</div>
      <div class="card-title">Abrechnung</div>
    </a>
  </div>

  <div class="footer">
    <div class="footer-icon">💡</div>
    <div class="footer-text"><b>Tipp:</b> Als App speichern • Teilen → Home-Bildschirm<br><b style="color:rgba(255,255,255,0.65)">Fragen? → EMS 01</b></div>
  </div>

  <div class="spacer"></div>
</div>

<div class="nav">
  <div class="nav-inner">
    <div class="nav-item active"><div class="nav-ic">🏠</div><div class="nav-lb">HOME</div></div>
    <div class="nav-item"><div class="nav-ic">📻</div><div class="nav-lb">FUNK</div></div>
    <div class="nav-item"><div class="nav-ic">👤</div><div class="nav-lb">PROFIL</div></div>
  </div>
</div>
</body>
</html>
