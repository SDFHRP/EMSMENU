."}),a("p",{className:"border-l-2 border-[#D90429] pl-4 italic bg-[#D90429]/5 py-3 pr-3 rounded-r",children:"Der LS EMS ist die unparteiische Instanz des Lebensschutzes. Wir urteilen nicht. Wir retten. Jeder Mensch, ob Zivilist, Beamter oder Straftäter, hat das gleiche Recht auf medizinische Hilfe."}),a("p",{children:"Dieses Grundgesetz ist mehr als Regelwerk – es ist Eid, Haltung und Verpflichtung. Wer das Wappen mit Star of Life, Lorbeerkranz und Krone trägt, trägt das Vertrauen der Stadt. Dieses Vertrauen darf niemals gebrochen werden."}),a("p",{className:"font-semibold text-[#0B4FB8]",children:"Möge jeder, der dieses Buch liest, verstehen: Hinter jeder Wunde steht ein Mensch. Hinter jeder Sirene steht Hoffnung. Unser Auftrag endet mit der sicheren Übergabe in die Klinik – Rettung, Stabilisierung, Transport."})]}),p("div",{className:"mt-8 pt-6 border-t border-[#081E3A]/10 flex justify-between sans text-[11px] text-[#081E3A]/50",children:[p("span",{className:"flex items-center gap-2",children:[a("img",{src:_,alt:"",className:"w-4 h-4 object-contain opacity-60"})," Beschlossen durch den Medical Director"]}),a("span",{children:"Pillbox Hill, Los Santos • V3.2"})]})]}),A===3&&p(UA,{title:"Artikel 1",subtitle:"Grundwerte des LS EMS",code:"EMS-GG Art. 1 • V3.2",children:[a(J,{n:"1",title:"Neutralität",children:"Der LS EMS handelt absolut neutral. Herkunft, Hautfarbe, Gangzugehörigkeit, Vorstrafen, Beruf oder persönliche Sympathie haben keinen Einfluss auf die Behandlung. Auch bei Gang-Schießereien, PD-Razzia oder Hochrisiko-Einsätzen wird jede Person gleich behandelt."}),a(J,{n:"2",title:"Primat des Lebens",children:"Das höchste Gut ist das menschliche Leben. Unser Handeln zielt auf Erhalt, Stabilisierung und Wiederherstellung sowie den sicheren Transport in die Klinik. Wirtschaftliche Interessen, persönliche Bequemlichkeit oder Zeitdruck rechtfertigen niemals eine unterlassene Hilfeleistung."}),a(J,{n:"3",title:"Absolute Gewaltfreiheit",children:"Bedienstete des LS EMS tragen und führen keine Schusswaffen, Schlagwaffen oder sonstige Waffen im Dienst. Selbstverteidigung erfolgt ausschließlich durch Rückzug und Absicherung durch LSPD/LSSD. Das Betreten eines aktiven Schusswechsels ist untersagt – Eigenschutz geht vor."}),a(J,{n:"4",title:"Unbestechlichkeit & Integrität",children:"Bestechung, Vetternwirtschaft, Gefälligkeits-Atteste, Verkauf von Medikamenten oder Informationen sind sofortiger Kündigungsgrund. Der Eid des EMS ist nicht käuflich. Angebote sind per /do zu dokumentieren und der Leitung zu melden."}),p("div",{className:"mt-6 bg-[#0B4FB8]/5 border border-[#D4A017]/20 rounded p-3 sans text-xs flex gap-2",children:[a("img",{src:_,alt:"",className:"w-8 h-8 object-contain shrink-0"}),p("div",{children:[a("b",{children:"RP-Leitsatz:"})," „Ich bin kein Polizist, kein Richter, kein Gangmitglied – ich bin Medic. Ich stabilisiere, ich transportiere, ich übergebe.“"]})]})]}),A===4&&p(UA,{title:"Artikel 2",subtitle:"Aufgaben und Zuständigkeit – Rettung, Behandlung, Transport",code:"EMS-GG Art. 2",children:[a(J,{n:"1",title:"Kernaufgaben",children:"Zu den Kernaufgaben zählen: Notfallrettung, präklinische Behandlung und Stabilisierung, qualifizierter Krankentransport, Erstversorgung bei Verkehrsunfällen, medizinische Absicherung von Großeinsätzen sowie die sichere Übergabe und Dokumentation an die aufnehmende Klinik."}),a(J,{n:"2",title:"Kein Eingriff in Polizeiarbeit",children:"Der Tatort gehört der Polizei. EMS sichert keine Beweise, verhört keine Zeugen und nimmt keine Festnahmen vor. Anweisungen von LSPD/LSSD zur Tatortsicherung sind zu befolgen, sofern sie nicht die Patientenversorgung unmöglich machen. Medizinische Entscheidungshoheit bleibt beim EMS."}),a(J,{n:"3",title:"Großschadenslagen",children:"Ab 3+ Verletzten oder MANV (Massenanfall) gilt: Leitender Notfallsanitäter oder Arzt übernimmt Triage und Transportorganisation. Einteilung in Sichtungskategorien ausschließlich für Lebendversorgung: Rot (sofort – vital bedroht), Gelb (dringend – stabilisierungspflichtig), Grün (leicht – gehfähig, spätere Versorgung). Fokus: schnellstmögliche Stabilisierung und gestaffelter Abtransport ins Pillbox. PD ist über Lage zu informieren – kein Abtransport vor Freigabe, außer akute Lebensgefahr erfordert sofortigen Transport."}),a(J,{n:"4",title:"Dokumentationspflicht",children:"Jeder Einsatz ist zu dokumentieren: Name, Verletzung, Behandlung, Vitalwerte, Transportziel, Klinikübergabe, /me /do Verlauf. Lückenlose Dokumentation sichert die Weiterbehandlung und schützt vor DOJ-Verfahren."})]}),A===5&&p(UA,{title:"Artikel 3",subtitle:"Rangsystem und Befugnisse – Fokus Rettung & Klinikübergabe",code:"EMS-GG Art. 3",children:[a("p",{className:"sans text-[13px] text-[#081E3A]/70 mb-4",children:"Beförderungen erfolgen ausschließlich durch Chefarzt / Medical Director nach Leistung, Aktivität, RP-Qualität und Fortbildungen. Kein Anspruch auf Beförderung durch Zeit. Alle Ränge dienen der Rettung und sicheren Versorgung."}),a("div",{className:"overflow-auto -mx-2 px-2",children:p("table",{className:"w-full text-left border-collapse sans",children:[a("thead",{children:p("tr",{className:"text-[10px] tracking-widest text-[#081E3A]/50 border-b border-[#081E3A]/20",children:[a("th",{className:"py-2 font-semibold",children:"RANG"}),a("th",{className:"py-2 font-semibold",children:"KÜRZEL"}),a("th",{className:"py-2 font-semibold",children:"BEFUGNIS / RP-FREIGABE"})]})}),a("tbody",{className:"text-[12px] leading-snug",children:Zp.map((o,f)=>p("tr",{className:`border-b border-[#081E3A]/10 ${f%2===0?"bg-[#0B4FB8]/[0.02]":""}`,children:[a("td",{className:"py-3 font-semibold text-[#081E3A]",children:o.rang}),a("td",{className:"py-3 mono text-[#D90429] font-semibold",children:o.kuerzel}),p("td",{className:"py-3",children:[a("div",{className:"font-medium",children:o.befugnis}),a("div",{className:"text-[11px] text-[#081E3A]/60 mt-1",children:o.freigabe})]})]},f))})]})}),a(J,{n:"5",title:"Weisungsbefugnis",compact:!0,children:"Höherer Rang hat Weisungsbefugnis. Im Einsatz gilt: Vor Ort höchste medizinische Qualifikation führt die Stabilisierung und Transportentscheidung, nicht automatisch höchster Rang. Ein Arzt kann einem L-NotSan bei Triage folgen, wenn dieser bessere Lageübersicht hat."})]}),A===6&&p(UA,{title:"Artikel 4",subtitle:"Dienstvorschriften – Bereitschaft & Transport",code:"EMS-GG Art. 4",children:[a(J,{n:"1",title:"Dienstbeginn & -ende",children:"Dienstbeginn: Anmeldung im Funk mit „10-8 EMS – [Rang] [Name] – Dienstnummer“, Anlegen der Uniform, Fahrzeugcheck (/me prüft RTW auf Vollständigkeit). Dienstende: Abmeldung „10-7 EMS“, Fahrzeug tanken, parken, säubern, Bericht abschließen. AFK über 5 Min. = 10-6."}),a(J,{n:"2",title:"Uniform- & Erscheinungspflicht",children:"Dienst nur in genehmigter EMS-Uniform. Keine Masken, keine Gang-Kleidung, keine zivilen Waffen sichtbar. Star of Life muss erkennbar sein. Praktikanten tragen „PRAK“ Weste."}),a(J,{n:"3",title:"Fahrzeugordnung",children:"Dienstfahrzeuge (Ambulance, EMS SUV, Heli) sind ausschließlich für Rettung und Transport. Kein Privatgebrauch, kein Tuning, kein Rennen. Unfall = sofort melden. RTW ist nach jedem Transport zu desinfizieren (/me desinfiziert Liege) und aufzutanken. Beschädigte Fahrzeuge ab 50% Motorschaden = ausmustern und Ersatz anfordern."}),a(J,{n:"4",title:"Melde- & Anwesenheitspflicht",children:"Unentschuldigtes Fehlen bei Pflichtfortbildung, grobe Regelverstöße oder OOC-Beleidigung werden dokumentiert. 3x Verwarnung = Gespräch mit Leitung. Krankmeldungen via Discord / MD-System."}),p("div",{className:"mt-4 grid grid-cols-2 gap-2 sans text-[11px]",children:[p("div",{className:"bg-emerald-50 border border-emerald-200 rounded p-2",children:[a("b",{children:"✓ Erlaubt:"})," /me, /do RP, Transport & Klinikübergabe"]}),p("div",{className:"bg-[#D90429]/5 border border-[#D90429]/20 rounded p-2",children:[a("b",{children:"✗ Verboten:"})," Privat-RTW, Waffen tragen, Sirene ohne Einsatz"]})]})]}),A===7&&p(UA,{title:"Artikel 5",subtitle:"Umgang mit Patienten – Stabilisierung & Transport",code:"EMS-GG Art. 5",children:[p(J,{n:"1",title:"RP-Pflicht & /me /do",children:["Jede Behandlung und jeder Transport muss gerollt werden. Pflicht: Mind. 3x /me und 2x /do pro Patient. Beispiel: ",a("span",{className:"mono text-xs bg-black/5 px-1 rounded",children:"/me legt Halskrause an, stabilisiert HWS, prüft Vitalwerte"})," ",a("span",{className:"mono text-xs bg-black/5 px-1 rounded",children:"/do Patient hätte starke Schmerzen, Blutung gestoppt, transportfähig?"})," Power-RP (*/me heilt komplett*) ist verboten."]}),a(J,{n:"2",title:"Einwilligung & RP-Abstimmung",children:"Bewusstlose gelten als einwilligungsunfähig, Stabilisierung und Transport sind Pflicht und werden immer durchgeführt. Bei ansprechbaren Personen: RP-Abstimmung via /ooc kurz fragen: „Behandlung + Transport ins Pillbox im RP ok?“. Verweigerung muss ausgespielt werden und wird dokumentiert. Keine Beleidigung bei Verweigerung."}),a(J,{n:"3",title:"Eigenschutz – Code Red",children:"Bei aktivem Schusswechsel, Explosion oder „Code Red“ gilt: KEINE Behandlung, KEIN Transport. Rückzug, Deckung suchen, LSPD informieren. Erst bei „Code 4 – Tatort sicher“ durch PD darf EMS vorrücken. Eigenschutz steht über Rettung. Eigene Verletzung = sofort Eigensicherung und Dienstpause."}),a(J,{n:"4",title:"Stabilisierung, Monitoring & Kliniktransport",children:"Fokus des EMS ist die kontinuierliche Stabilisierung: Herzdruckmassage-RP, Defi-RP, Blutstillung, Schienung, O2, Monitoring, Lagerung. Kein „*wiederbelebt*“, kein Instant-Heal. Jeder Patient wird nach Stabilisierung ins Pillbox Medical Center transportiert und dort an Klinikpersonal übergeben – inkl. mündlicher Übergabe und Dokumentation. Keine Wunderheilung – nur saubere Rettungskette."})]}),A===8&&p(UA,{title:"Artikel 6",subtitle:"Schweigepflicht & Datenschutz",code:"EMS-GG Art. 6",children:[a(J,{n:"1",title:"Ärztliche Schweigepflicht",children:"Alles, was im MD, im RTW oder am Einsatzort über Patienten bekannt wird, unterliegt der Schweigepflicht. Dazu zählen: Name, Verletzung, Medikamente, Vorerkrankungen, psychische Verfassung. „Was im MD passiert, bleibt im MD.“ – Das gilt auch nach Transport und Klinikübergabe."}),a(J,{n:"2",title:"Weitergabe an Behörden",children:"Weitergabe an LSPD/LSSD nur mit schriftlicher Einwilligung des Patienten oder bei akuter Gefahr für Leib und Leben Dritter (z.B. Ankündigung einer Bombe, Amoklauf). Bei Schussverletzungen darf PD informiert werden, dass eine Person stabilisiert und transportiert wurde – aber nicht, was sie gesagt hat. Immer DOJ informieren bei Unsicherheit."}),a(J,{n:"3",title:"Datenschutz & Akten",children:"Krankenakten und Transportberichte dürfen nur von EMS eingesehen werden. Weitergabe, Screenshot von Akten, Veröffentlichung auf Discord ist verboten und führt zur sofortigen Suspendierung. Akten sind nach 7 Tagen IC zu archivieren."}),p("div",{className:"mt-6 border-l-4 border-[#0B4FB8] bg-[#0B4FB8]/5 p-4 serif italic text-[14px] flex gap-3",children:[a("img",{src:_,alt:"",className:"w-10 h-10 object-contain shrink-0 opacity-80"}),a("span",{children:"„Vertrauen ist das einzige Medikament, das wir nicht ersetzen können. Wer es bricht, bricht den Eid.“"})]})]}),A===9&&p(UA,{title:"Artikel 7",subtitle:"Zusammenarbeit mit Behörden",code:"EMS-GG Art. 7",children:[a(J,{n:"1",title:"LSPD & LSSD",children:"Polizei sichert, EMS rettet und transportiert. PD hat Weisungsbefugnis bei Tatort-Sperrung, EMS hat Weisungsbefugnis bei medizinischen Entscheidungen (z.B. Patient muss sofort stabilisiert und ins Krankenhaus transportiert werden, auch wenn PD noch befragen will). Konflikte sachlich im Funk klären, danach ggf. DOJ einschalten – kein Streit vor Patienten."}),a(J,{n:"2",title:"DOJ & Gericht",children:"EMS ist neutraler Zeuge, kein Ermittler. Vor Gericht wahrheitsgemäß aussagen, keine Partei ergreifen. Atteste nur nach Untersuchung ausstellen – Gefälligkeitsatteste = fristlose Kündigung + DOJ-Verfahren."}),a(J,{n:"3",title:"Feuerwehr & Technical Rescue",children:"Bei Bränden, eingeklemmten Personen, Höhenrettung: Feuerwehr hat technische Leitung, EMS medizinische Stabilisierung und Transportvorbereitung. Kein Betreten von brennenden Gebäuden ohne Feuerwehr-Freigabe."}),a(J,{n:"4",title:"Interne Kommunikation",children:"Respektvoller Ton gegenüber allen Behörden. Kein „PD ist nutzlos“ im Funk, kein Trash-Talk. Wir sind Vorbild. Gemeinsame Funkfrequenz nur für Einsatzrelevantes."})]}),A===10&&p(UA,{title:"Artikel 8",subtitle:"Funk & Kommunikation",code:"EMS-GG Art. 8",children:[a(J,{n:"1",title:"Funkdisziplin",children:"Funk ist IC. OOC hat im Funk nichts verloren. Keine Musik, kein Spam, keine Beleidigungen. Kurz, präzise, professionell. Dienstbeginn immer mit Statuscode anmelden."}),a("div",{className:"mt-3 grid grid-cols-1 md:grid-cols-2 gap-3 sans",children:[{code:"10-4",desc:"Verstanden"},{code:"10-8",desc:"Im Dienst / Einsatzbereit"},{code:"10-7",desc:"Außer Dienst"},{code:"10-20",desc:"Standort – z.B. 10-20 Pillbox"},{code:"10-23",desc:"Am Einsatzort angekommen"},{code:"Code 4",desc:"Lage unter Kontrolle / Tatort sicher"},{code:"Code 6",desc:"Patient kritisch – Stabilisierung läuft"},{code:"Code 3",desc:"Notfallfahrt mit Sondersignal"},{code:"Code Red",desc:"Aktiver Schusswechsel – nicht anfahren"},{code:"10-6",desc:"Beschäftigt / kurz AFK"}].map((o)=>p("div",{className:"flex gap-3 border border-[#081E3A]/10 rounded px-3 py-2 bg-white shadow-sm",children:[a("span",{className:"mono font-bold text-[#D90429] w-16",children:o.code}),a("span",{className:"text-[12px] text-[#081E3A]/80",children:o.desc})]},o.code))}),p(J,{n:"2",title:"Kommunikationsbeispiel",compact:!0,children:[a("span",{className:"mono text-xs bg-[#0B4FB8] text-white px-2.5 py-1 rounded border border-[#D4A017]/30",children:"Beispiel: „10-8 EMS, NotSan Miller 314, 10-20 Pillbox, Code 3 frei – bereit für Transport.“"})," – Danach Leitstelle bestätigt: „10-4 Miller, 314.“"]})]}),A===11&&p(UA,{title:"Artikel 9",subtitle:"Verhalten im Dienst",code:"EMS-GG Art. 9",children:[a(J,{n:"1",title:"Vorbildfunktion",children:"Wer EMS trägt, repräsentiert den Staat. Freundliches, ruhiges, professionelles Auftreten – auch bei provokanten Patienten. Keine Beleidigungen, kein Rassismus, kein OOC-Flame."}),a(J,{n:"2",title:"Korruptionsverbot",children:"Keine Annahme von Geld, Drogen, Waffen oder Gefälligkeiten. Keine Begünstigung von Freunden/Gangs. Keine private Behandlung außerhalb des Dienstes für Geld. Jede Korruption wird an DOJ weitergeleitet und führt zur fristlosen Entlassung."}),a(J,{n:"3",title:"Drogen- & Crime-Verbot",children:"Konsum von Drogen, Teilnahme an Straftaten, Überfälle oder illegales Tuning während oder kurz vor Dienst sind verboten. Wer straffällig wird, wird suspendiert bis zur DOJ-Klärung. EMS-Mitarbeiter dürfen keine Maske bei Straftaten tragen, um Identität zu verschleiern."}),a(J,{n:"4",title:"Trolling & Fail-RP",children:"Absichtliches Rammen, RTW als Waffe nutzen, Patienten fallen lassen, absichtlich schlechtes /me, „/me bewusstlos“ ohne RP = sofortige Sanktion. EMS ist kein Spaß-Fraktion, sondern Serious-RP mit Fokus auf Rettung und Transport."})]}),A===12&&p(UA,{title:"Artikel 10",subtitle:"Sanktionen, Eid & Inkrafttreten",code:"EMS-GG Art. 10 • V3.2",children:[a(J,{n:"1",title:"Stufen der Sanktion",children:"Sanktionen erfolgen proportional, nach Anhörung, dokumentiert im Personalakt:"}),p("div",{className:"sans text-[13px] space-y-2 mt-3",children:[p("div",{className:"flex gap-3 p-3 rounded border border-[#D4A017]/30 bg-[#D4A017]/10",children:[a("span",{className:"font-bold w-28 text-[#081E3A]",children:"Stufe 1"}),p("span",{children:[a("b",{children:"Mündliche Verwarnung"})," – bei kleinen Verstößen, z.B. Funkfehler, Uniform vergessen."]})]}),p("div",{className:"flex gap-3 p-3 rounded border border-orange-200 bg-orange-50",children:[a("span",{className:"font-bold w-28",children:"Stufe 2"}),p("span",{children:[a("b",{children:"Schriftliche Ver
